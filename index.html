<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kado dari Baby Seal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: satu kolom di tengah. Si anjing laut dan kue jadi pusat perhatian, sisanya tenang. */
:root{
  --sky-1:#efe6ff; --sky-2:#ffe6ea; --sky-3:#ffeedd; --sea-1:#d3edf7; --sea-2:#b0daee;
  --ink:#463957; --ink-soft:#6f5f82;
  --berry:#c93c68; --berry-dark:#9c2a4e;
  --pink:#ffb5c8; --peach:#ffd3bd; --cream:#fff5e8; --lav:#cbb7f2; --butter:#ffe7a0; --sky-blue:#bfe3f3;
  --seal:#b7c6de; --seal-shade:#9aaccb; --belly:#f5f2f8; --nose:#3a2d46; --cheek:#ffa9bd; --heart:#ff7e9d;
  --card:#fffaf6; --paper:#fff3c4;
  --leaf-1:#a9dcb8; --leaf-2:#c3ebc4; --leaf-3:#8ecaa2; --bark:#c49a7c; --bark-lite:#d8b597; --grass:#b8e3b0; --grass-2:#a3d79f;
  --font-display:'Fredoka',ui-rounded,'Nunito',system-ui,sans-serif;
  --font-body:'Nunito',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%}
body{
  min-height:100%; background:var(--sky-2); color:var(--ink);
  font-family:var(--font-body); font-size:1rem; line-height:1.55;
  padding-inline:16px; padding-block:28px 100px;
  display:grid; place-items:center; overflow-x:clip;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--berry); outline-offset:3px}

/* ---------- Latar ---------- */
.scenery{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 44%,var(--sky-3) 64%,var(--sea-1) 86%)}
.cloud{position:absolute; height:34px; width:110px; border-radius:40px; background:#fff; opacity:.7; animation:drift 70s linear infinite}
.cloud::before,.cloud::after{content:''; position:absolute; background:#fff; border-radius:50%}
.cloud::before{width:52px; height:52px; left:16px; top:-24px}
.cloud::after{width:38px; height:38px; left:56px; top:-14px}
.cloud.c1{top:9%; left:-140px}
.cloud.c2{top:22%; left:-140px; transform:scale(.7); animation-duration:95s; animation-delay:-40s}
@keyframes drift{to{translate:calc(100vw + 300px) 0}}
.deco-star{position:absolute; animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35; transform:scale(.8)}50%{opacity:1; transform:scale(1.1)}}
.deco-heart{position:absolute; bottom:-30px; opacity:.55; animation:floatup linear infinite}
@keyframes floatup{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-115vh) rotate(10deg)}}
.deco-bubble{position:absolute; bottom:-30px; border-radius:50%; border:2px solid rgba(255,255,255,.9); background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),rgba(255,255,255,.12) 60%); animation:floatup linear infinite}
.waves{position:absolute; left:0; right:0; bottom:0; height:92px; overflow:hidden}
.wave{position:absolute; left:0; bottom:0; width:200%; height:66px; animation:slide 18s linear infinite}
.wave.w1{fill:#a8d6ec; opacity:.8; bottom:14px}
.wave.w2{fill:#c6e8f5; animation-duration:24s; animation-direction:reverse}
@keyframes slide{to{transform:translateX(-50%)}}
.fish{position:absolute; bottom:26px; left:0; width:46px; animation:swim 32s linear infinite}
@keyframes swim{
  0%{transform:translateX(-20vw) scaleX(1)}
  49.9%{transform:translateX(110vw) scaleX(1)}
  50%{transform:translateX(110vw) scaleX(-1)}
  100%{transform:translateX(-20vw) scaleX(-1)}
}
.shore{position:absolute; bottom:6px}
.shore.star{left:10px; width:44px}
.shore.shell{right:16px; width:40px}

/* ---------- Panggung ---------- */
.stage{position:relative; z-index:2; width:min(100%,520px)}
.scene{display:flex; flex-direction:column; align-items:center; gap:22px; text-align:center}
.scene.enter{animation:enter .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0; transform:translateY(14px) scale(.98)}to{opacity:1; transform:none}}
.title{margin:0; font-family:var(--font-display); font-weight:600; font-size:clamp(1.55rem,6.4vw,2.2rem); line-height:1.2; text-wrap:balance}
.hint{margin:0; font-weight:700; color:var(--ink-soft)}

.btn{
  font-family:var(--font-display); font-weight:600; font-size:1.25rem; letter-spacing:.01em;
  padding:15px 34px; border:0; border-radius:999px; cursor:pointer;
  background:var(--berry); color:#fff;
  box-shadow:0 6px 0 var(--berry-dark), 0 14px 24px rgba(201,60,104,.28);
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--berry-dark), 0 6px 12px rgba(201,60,104,.25)}
.btn:disabled{cursor:default; opacity:.7; transform:translateY(4px); box-shadow:0 2px 0 var(--berry-dark)}
.btn.soft{background:#fff; color:var(--ink); box-shadow:0 5px 0 #e3d3ee, 0 12px 20px rgba(120,80,140,.14)}
.btn.soft:active{box-shadow:0 1px 0 #e3d3ee}

.sound{
  position:fixed; z-index:30; top:calc(env(safe-area-inset-top,0px) + 12px); right:12px;
  width:46px; height:46px; border-radius:50%; border:2px solid #fff; background:rgba(255,255,255,.85);
  font-size:1.2rem; cursor:pointer; box-shadow:0 6px 16px rgba(120,80,140,.16);
}

/* ---------- Anjing laut ---------- */
.seal{display:block; width:100%; height:auto; overflow:visible; --ex:0px; --ey:0px}
.seal .m,.seal .eyes-closed,.seal .hold-heart,.seal .wind{display:none}
.seal[data-mood="happy"] .m-smile,.seal[data-mood="hug"] .m-smile{display:block}
.seal[data-mood="curious"] .m-o{display:block}
.seal[data-mood="blow"] .m-blow{display:block}
.seal[data-mood="cheer"] .m-open{display:block}
.seal[data-mood="blow"] .eyes,.seal[data-mood="cheer"] .eyes{display:none}
.seal[data-mood="blow"] .eyes-closed,.seal[data-mood="cheer"] .eyes-closed{display:block}
.seal[data-mood="blow"] .wind{display:block; animation:gust .5s ease-out infinite}
.seal[data-mood="hug"] .hold-heart{display:block; animation:beat 1.1s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
@keyframes gust{from{opacity:0; transform:translateX(8px)}40%{opacity:1}to{opacity:0; transform:translateX(-10px)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.seal .cheek{transform-box:fill-box; transform-origin:center; transition:transform .25s}
.seal[data-mood="blow"] .cheek{transform:scale(1.55)}
.seal[data-mood="happy"] .hl1{transform:scale(1.4)}
.seal[data-mood="curious"] .eye-in{transform:scale(1.12)}
.seal .hl1,.seal .hl2{transform-box:fill-box; transform-origin:center; transition:transform .25s}
.seal .eye{transform:translate(var(--ex),var(--ey)); transition:transform .12s ease-out}
.seal .eye-in{transform-box:fill-box; transform-origin:center; animation:blink 5s ease-in-out infinite; animation-delay:var(--bd,0s)}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.seal .s-all{transform-box:fill-box; transform-origin:50% 100%}
.seal .s-body{transform-box:fill-box; transform-origin:50% 100%; animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,1.045)}}
.seal .s-head{transform-box:fill-box; transform-origin:50% 92%; animation:headbob 5s ease-in-out infinite}
@keyframes headbob{0%,100%{transform:rotate(0)}50%{transform:rotate(1.8deg)}}
.seal[data-mood="curious"] .s-head{animation:tilt 1.5s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.seal .fl{transform-box:fill-box; transform-origin:50% 8%; transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.seal .fl-r{animation:waveR 2.8s ease-in-out infinite}
.seal .fl-l{animation:waveL 2.8s ease-in-out 1.4s infinite}
@keyframes waveR{0%,60%,100%{transform:rotate(0)}30%{transform:rotate(-17deg)}}
@keyframes waveL{0%,60%,100%{transform:rotate(0)}30%{transform:rotate(17deg)}}
.seal[data-mood="cheer"] .fl-r{animation:cheerR .45s ease-in-out infinite}
.seal[data-mood="cheer"] .fl-l{animation:cheerL .45s ease-in-out infinite}
@keyframes cheerR{50%{transform:rotate(-36deg)}}
@keyframes cheerL{50%{transform:rotate(36deg)}}
.seal[data-mood="cheer"] .s-all{animation:hop .62s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.03,.96)}45%{transform:translateY(-16px) scale(.98,1.03)}}
.seal[data-mood="hug"] .fl{animation:none}
.seal[data-mood="hug"] .fl-l{transform:translate(8px,-8px) rotate(-64deg)}
.seal[data-mood="hug"] .fl-r{transform:translate(-8px,-8px) rotate(64deg)}
.seal-wrap{position:relative; cursor:pointer; -webkit-user-select:none; user-select:none}
.seal-wrap.boing .seal{animation:boing .5s ease-out; transform-origin:50% 100%}
@keyframes boing{30%{transform:scale(1.1,.9)}60%{transform:scale(.95,1.07)}}
.say{
  position:absolute; left:50%; top:2%; transform:translate(-50%,-100%);
  background:#fff; color:var(--berry-dark); font-family:var(--font-display); font-weight:600; font-size:.95rem;
  padding:4px 12px; border-radius:14px; white-space:nowrap; box-shadow:0 6px 14px rgba(120,80,140,.18);
  animation:sayin .25s cubic-bezier(.34,1.56,.64,1) both; pointer-events:none; z-index:3;
}
@keyframes sayin{from{opacity:0; transform:translate(-50%,-70%) scale(.6)}}
.fh{position:absolute; left:50%; top:20%; color:var(--heart); font-size:1.5rem; pointer-events:none; animation:fh 1.2s ease-out forwards; z-index:3}
@keyframes fh{from{opacity:1; transform:translate(-50%,0) scale(.6)}to{opacity:0; transform:translate(calc(-50% + var(--dx,0px)),-90px) scale(1.2)}}

/* ---------- Adegan 1: amplop ---------- */
.env-wrap{position:relative; padding-top:104px}
.envelope{
  position:relative; display:block; width:min(280px,78vw); aspect-ratio:14/9; padding:0; border:0; background:none;
  cursor:pointer; perspective:900px; transform-origin:50% 100%; animation:wobble 3.4s ease-in-out infinite;
}
.envelope.open{animation:none}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.2deg)}75%{transform:rotate(2.2deg)}}
.envelope>*{position:absolute}
.env-back{inset:0; background:#f6b3c4; border-radius:14px; box-shadow:0 16px 30px rgba(120,70,120,.2)}
.env-letter{
  left:5%; right:5%; top:6%; height:84%; z-index:1; border-radius:10px; background-color:var(--cream);
  background-image:repeating-linear-gradient(180deg,transparent 0 17px,rgba(201,60,104,.14) 17px 19px);
  transition:transform .8s .35s cubic-bezier(.3,1.3,.5,1);
}
.env-seal{left:50%; top:-104px; width:62%; margin-left:-31%; z-index:2}
.env-front{inset:0; z-index:3; border-radius:14px; background:linear-gradient(160deg,#ffcbd8,#ffb8cb); clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env-flap{
  left:0; right:0; top:0; height:58%; z-index:4; background:#ffa5bb; clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:50% 0; transition:transform .55s ease, z-index 0s .25s;
}
.env-wax{left:50%; top:58%; width:38px; height:38px; margin:-19px 0 0 -19px; z-index:5; transition:opacity .25s}
.envelope.open .env-flap{transform:rotateX(180deg); z-index:0}
.envelope.open .env-letter{transform:translateY(-58%)}
.envelope.open .env-wax{opacity:0}

/* ---------- Adegan 2: kue ---------- */
.cake-wrap{position:relative; width:min(330px,86vw)}
.cake{display:block; width:100%; height:auto; overflow:visible; filter:drop-shadow(0 12px 14px rgba(110,70,140,.12))}
.cake-seal{position:absolute; right:-3%; bottom:-5%; width:36%}
.flame .fl-in{transform-box:fill-box; transform-origin:50% 100%; animation:flicker .5s ease-in-out infinite alternate; animation-delay:var(--fd,0s)}
@keyframes flicker{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.1) rotate(3deg)}}
.flame{transition:opacity .2s}
.flame.out{opacity:0}
.flame .puff{opacity:0}
.flame.out .puff{animation:puff 1.2s ease-out forwards}
@keyframes puff{from{opacity:.7; transform:translateY(0) scale(.6)}to{opacity:0; transform:translateY(-22px) scale(2)}}
.flame .puff{transform-box:fill-box; transform-origin:center}

/* ---------- Adegan 3: pesan ---------- */
.msg-seal{width:132px}
.bubble{position:relative; width:100%; background:var(--card); border-radius:30px; padding:24px 22px 28px; box-shadow:0 16px 34px rgba(120,80,140,.16)}
.bubble::before{content:''; position:absolute; top:-13px; left:50%; margin-left:-13px; border:13px solid transparent; border-top:0; border-bottom:14px solid var(--card)}
.who{margin:0 0 8px; font-weight:700; font-size:.95rem; color:var(--ink-soft)}
.greet{margin:0 0 12px; font-family:var(--font-display); font-weight:600; font-size:clamp(1.5rem,6.2vw,2rem); line-height:1.2; text-wrap:balance}
.msg{margin:0; font-size:1.07rem; min-height:1.55em}
.typing::after{content:''; display:inline-block; width:2px; height:1.05em; margin-left:3px; vertical-align:-.15em; background:var(--berry); animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.gift{
  display:flex; align-items:center; gap:14px; padding:12px 22px 12px 14px; border-radius:24px;
  border:2px dashed #b99ad9; background:rgba(255,255,255,.75); cursor:pointer;
  font-weight:800; font-size:1.02rem; color:var(--ink); text-align:left;
  transition:transform .15s ease;
}
.gift:hover:not(:disabled){transform:translateY(-2px)}
.gift:disabled{cursor:default}
.gift svg{width:54px; height:54px; flex:none; overflow:visible}
.gift .lid{transform-box:fill-box; transform-origin:0% 100%; transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.gift.open .lid{transform:translate(2px,-16px) rotate(-22deg)}
.secret{position:relative; width:min(100%,400px); background:var(--paper); padding:26px 24px 24px; border-radius:6px 24px 8px 22px; box-shadow:0 14px 26px rgba(150,110,40,.18); transform:rotate(-1.3deg)}
.secret::before{
  content:''; position:absolute; top:-12px; left:50%; width:88px; height:22px; margin-left:-44px; transform:rotate(3deg);
  background:repeating-linear-gradient(45deg,rgba(255,181,200,.9) 0 8px,rgba(255,255,255,.7) 8px 16px);
}
.secret h3{margin:0 0 6px; font-family:var(--font-display); font-weight:600; font-size:1.15rem}
.secret p{margin:0; font-size:1.06rem}
.closing{display:flex; flex-direction:column; align-items:center; gap:14px}
.hug-seal{width:176px}
.sign{margin:0; font-family:var(--font-display); font-weight:500; font-size:1.3rem; display:flex; align-items:center; gap:8px}
.sign svg{width:24px; height:24px; animation:beat 1.1s ease-in-out infinite}

/* ---------- Efek perayaan ---------- */
#fx{position:fixed; inset:0; z-index:20; overflow:hidden; pointer-events:none}
#confetti{position:absolute; inset:0; width:100%; height:100%}
.rain{position:absolute; top:-40px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(50deg)}}
.balloon{position:absolute; bottom:-150px; width:46px; height:58px; background:var(--c); border-radius:50% 50% 47% 47%/55% 55% 45% 45%; animation:rise linear forwards}
.balloon::before{content:''; position:absolute; left:10px; top:10px; width:9px; height:15px; border-radius:50%; background:rgba(255,255,255,.55); transform:rotate(20deg)}
.balloon::after{content:''; position:absolute; left:50%; top:100%; width:1.5px; height:60px; background:rgba(70,57,87,.4)}
@keyframes rise{0%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-70vh) rotate(5deg)}100%{transform:translateY(-135vh) rotate(-4deg)}}

/* ---------- Anjing laut kecil yang mengintip ---------- */
#peekers{position:fixed; inset:0; z-index:1; pointer-events:none}
.peek{position:absolute; width:86px; transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.peek svg{display:block; width:100%; height:auto; animation:peekbob 4.5s ease-in-out infinite}
@keyframes peekbob{50%{transform:translateY(-4px)}}
.peek.l{left:0; bottom:24%; transform:translateX(-64%) rotate(10deg)}
.peek.r{right:0; bottom:44%; transform:translateX(64%) scaleX(-1) rotate(10deg)}
.peek.b{left:14%; bottom:62px; transform:translateY(62%)}
.peek.l.pop{transform:translateX(6%) rotate(-6deg)}
.peek.r.pop{transform:translateX(-6%) scaleX(-1) rotate(-6deg)}
.peek.b.pop{transform:translateY(-18%)}
.pb{position:absolute; left:52px; top:-58px; width:34px; height:42px; background:var(--c); border-radius:50% 50% 47% 47%/55% 55% 45% 45%}
.pb::after{content:''; position:absolute; left:50%; top:100%; width:1.5px; height:32px; background:rgba(70,57,87,.4)}
.pop .pb{animation:peekbob 1.6s ease-in-out infinite}
.pg{position:absolute; right:-6px; bottom:6px; width:30px; height:26px; background:var(--lav); border-radius:5px}
.pg::before{content:''; position:absolute; left:50%; top:0; bottom:0; width:6px; margin-left:-3px; background:var(--butter)}
.pg::after{content:''; position:absolute; left:-2px; right:-2px; top:-5px; height:8px; border-radius:4px; background:var(--pink)}

/* ---------- Adegan 4: pohon harapan ---------- */
.btn.sm{font-size:1.05rem; padding:11px 22px}
.tree-wrap{position:relative; width:min(400px,94vw)}
.tree{display:block; width:100%; height:auto; overflow:visible}
.tree-g{transform-box:fill-box; transform-origin:50% 100%}
.tree.grow .tree-g{animation:growin .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes growin{from{transform:scale(.86); opacity:.6}to{transform:none; opacity:1}}
.tree .tag{cursor:pointer}
.tree .tag:focus{outline:none}
.tree .tag:focus-visible .tag-h{stroke:var(--berry); stroke-width:3}
.tree .tag-sway{transform-box:fill-box; transform-origin:50% 0; animation:sway 4.4s ease-in-out infinite; animation-delay:var(--d,0s)}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.tree .slot .tag-h{animation:slotpulse 1.6s ease-in-out infinite}
@keyframes slotpulse{50%{opacity:.4}}
.tree .firefly{transform-box:fill-box; transform-origin:center; animation:twinkle 3s ease-in-out infinite}
.tree-seal{position:absolute; left:3%; bottom:1%; width:30%}
.panel{width:100%; background:var(--card); border-radius:24px; padding:20px 20px 22px; box-shadow:0 14px 30px rgba(120,80,140,.16); text-align:center}
.panel.enter{animation:enter .5s cubic-bezier(.2,.8,.2,1) both}
.panel h3{margin:0 0 8px; font-family:var(--font-display); font-weight:600; font-size:1.25rem}
.reader-text{margin:0 0 6px; font-size:1.08rem; overflow-wrap:anywhere}
.panel .row{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:14px}
#wish-form label{display:block; margin-bottom:8px; font-family:var(--font-display); font-weight:600; font-size:1.2rem}
#wish-form textarea{display:block; width:100%; min-height:100px; resize:vertical; padding:12px 14px; border:2px solid #e3d3ee; border-radius:16px; background:#fff; color:var(--ink); font:inherit; line-height:1.5}
#wish-form .row{justify-content:space-between; align-items:center}
.count{font-weight:700; font-size:.92rem; color:var(--ink-soft)}
.btns{display:flex; flex-wrap:wrap; gap:10px}
.note{margin:0; font-size:.92rem; font-weight:700; color:var(--ink-soft)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
  .deco-heart,.deco-bubble{display:none}
}
</style>

<div class="scenery" aria-hidden="true">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div id="deco"></div>
  <div class="waves">
    <svg class="wave w1" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 30Q25 6 50 30T100 30T150 30T200 30T250 30T300 30T350 30T400 30V60H0Z"/></svg>
    <svg class="fish" viewBox="0 0 46 28"><ellipse cx="18" cy="14" rx="15" ry="10" fill="#ffc7a8"/><path d="M30 14 L45 4 L45 24Z" fill="#ffb08a"/><circle cx="9" cy="11" r="2.4" fill="#3a2d46"/><path d="M14 20q5 3 10 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/></svg>
    <svg class="wave w2" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 30Q25 6 50 30T100 30T150 30T200 30T250 30T300 30T350 30T400 30V60H0Z"/></svg>

/* ---------- Suara (aktif hanya jika diklik) ---------- */
var AC = window.AudioContext || window.webkitAudioContext, ctx = null, master = null, musicTimer = null, soundOn = false;
function tone(f, t, d, type, vol){
  if(!soundOn || !ctx) return;

  }catch(e){}
}
/* musik latar tipis: kotak musik orisinal yang berulang pelan */
var CHORDS = [[523.25, 659.25, 783.99], [440, 523.25, 659.25], [349.23, 440, 523.25], [392, 493.88, 587.33]];
var PATTERN = [0, 1, 2, 1, 2, 1, 0, 1];
function startMusic(){
  stopMusic();

  function play(){
    if(!soundOn || !ctx) return;
    var ch = CHORDS[bar % 4];
    tone(ch[0] / 2, 0, 3.6, 'sine', 0.02);
    PATTERN.forEach(function(p, i){ tone(ch[p] * (i % 4 === 3 ? 2 : 1), i * 0.5, 1.3, 'sine', 0.016); });

}

(function(){

    var pts = [];
    for(var i = 0; i < n * 2; i++){
      var a = -Math.PI / 2 + i * Math.PI / n, r = i % 2 ? ri : ro;
      pts.push((cx + Math.cos(a) * r).toFixed(1) + ',' + (cy + Math.sin(a) * r).toFixed(1));

    return pts.join(' ');
  }
  $('#starfish').setAttribute('points', poly(30, 30, 22, 11, 5));

  }

  }
  for(i = 0; i < 8; i++){
    var bs = 10 + R() * 16;
    html += '<span class="deco-bubble" style="left:' + (R() * 96).toFixed(1) + '%;width:' + bs.toFixed(0) + 'px;height:' + bs.toFixed(0) + 'px;animation-duration:' + (11 + R() * 9).toFixed(1) + 's;animation-delay:-' + (R() * 14).toFixed(1) + 's"></span>';
  }
  deco.innerHTML = html;
})();

  var chars = Array.from(text);

  el.textContent = ''; el.classList.add('typing');
  return new Promise(function(resolve){

  renderTree(true);
  openReader(age);
  var seal = $('#tree-seal .seal'); seal.dataset.mood = 'cheer'; sfx.celebrate();
  setTimeout(function(){ seal.dataset.mood = 'happy'; }, reduce ? 0 : 2000);
  if(!reduce) confetti(60);
});

$('#to-tree').addEventListener('click', function(){
  show('tree'); renderTree(false);
  $('#wish-reader').hidden = true; $('#wish-form').hidden = true;
});
$('#tree-back').addEventListener('click', function(){ show('message'); });
renderTree(false);

/* wish yang tersimpan di database dibaca saat tersedia; jika tidak, tetap berjalan dari perangkat ini */
(async function(){
  try{
    if(!window.claude || !window.claude.use) return;
    var db = await window.claude.use('db');
    if(!db) return;
    dbc = db;
    db.collection('wishes').onSnapshot(function(snap){
      snap.docs.forEach(function(doc){
        var v = doc.data();
        if(v && typeof v.age === 'number' && typeof v.text === 'string'){
          wishes[String(v.age)] = { age:v.age, text:v.text, at:typeof v.at === 'string' ? v.at : '' };
        }
      });
      saveLocal(); renderTree(false);
    }, function(){});
  }catch(e){}
})();
})();
</script>
